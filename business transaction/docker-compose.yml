services:
  postgres:
    image: postgres:17
    container_name: business-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-prashant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting Docker Compose}
      POSTGRES_DB: ${DB_NAME:-businessdb}
    ports:
      - "${DB_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: business-dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-businessdb}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-prashant}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting Docker Compose}
    ports:
      - "8080:8080"

volumes:
  postgres_data: